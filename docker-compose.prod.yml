# ClauseFlow — Production docker-compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# BEFORE STARTING:
#   1. Copy .env.prod.example → .env.prod and fill every value
#   2. Point your domain's A record to this server's IP
#   3. docker compose -f docker-compose.prod.yml up -d

services:

  # ── PostgreSQL (pgvector for semantic search) ────────────────────────────
  db:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: clauseflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not exposed to host — only reachable inside the Docker network

  # ── Redis (BullMQ job queues) ────────────────────────────────────────────
  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --save 60 1 --loglevel warning'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ── MinIO (S3-compatible file storage) ──────────────────────────────────
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Console reachable via Caddy at storage.yourdomain.com (optional)

  # ── Create storage bucket on first boot ──────────────────────────────────
  createbuckets:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      set -eu;
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      /usr/bin/mc mb local/clauseflow --ignore-existing &&
      /usr/bin/mc stat local/clauseflow;
      "
    restart: "no"

  # ── DocuSeal (self-hosted e-signatures) ──────────────────────────────────
  docuseal-secret-check:
    profiles: ["signing"]
    network_mode: "none"
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    environment:
      DOCUSEAL_SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$DOCUSEAL_SECRET_KEY_BASE" in
          *[!0-9a-fA-F]*|"") echo "DOCUSEAL_SECRET_KEY_BASE must be 128 hexadecimal characters generated with openssl rand -hex 64." >&2; exit 1 ;;
        esac
        if [ "$${#DOCUSEAL_SECRET_KEY_BASE}" -ne 128 ]; then
          echo "DOCUSEAL_SECRET_KEY_BASE must be 128 hexadecimal characters generated with openssl rand -hex 64." >&2
          exit 1
        fi
    restart: "no"

  docuseal:
    profiles: ["signing"]
    # Keep default stack interpolation independent of optional signing setup.
    image: ${DOCUSEAL_IMAGE:-docuseal/docuseal@sha256:063f9b89fa99816d0c2f90c33e4e176ecbbdf8cddd4958e40562643d0431dfbc}
    volumes:
      - docusealdata:/data
    environment:
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:-}
      HOST: sign.${DOMAIN:?DOMAIN must be set}
      FORCE_SSL: "false"  # Caddy handles SSL
    depends_on:
      docuseal-secret-check:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── ClauseFlow web app (Next.js) ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ACTION_LEDGER_UI_ENABLED: ${NEXT_PUBLIC_ACTION_LEDGER_UI_ENABLED:-false}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/clauseflow
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      AGREEMENT_ACCESS_EMERGENCY_DENY_ALL: ${AGREEMENT_ACCESS_EMERGENCY_DENY_ALL:-false}
      DOCUMENT_EXPORT_RETENTION_SECONDS: ${DOCUMENT_EXPORT_RETENTION_SECONDS:-86400}
      INTERNAL_APP_URL: http://app:3000
      # Storage
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: clauseflow
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_REGION: us-east-1
      # Notification encryption (required)
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:?NOTIFICATION_ENCRYPTION_KEY must be set}
      # AI (optional — users bring their own key)
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_PRIVATE_ORIGINS: ${OLLAMA_PRIVATE_ORIGINS:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-clauseflow-app}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Email (Resend SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@${DOMAIN}}
      # DocuSeal
      DOCUSEAL_API_URL: ${DOCUSEAL_API_URL:-https://api.docuseal.com}
      DOCUSEAL_API_KEY: ${DOCUSEAL_API_KEY:-}
      DOCUSEAL_PRIVATE_ORIGINS: ${DOCUSEAL_PRIVATE_ORIGINS:-}
      DOCUSEAL_WEBHOOK_SECRET: ${DOCUSEAL_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── ClauseFlow worker (BullMQ background jobs) ────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.worker
    environment:
      NODE_ENV: production
      AGREEMENT_ACCESS_EMERGENCY_DENY_ALL: ${AGREEMENT_ACCESS_EMERGENCY_DENY_ALL:-false}
      DOCUMENT_EXPORT_RETENTION_SECONDS: ${DOCUMENT_EXPORT_RETENTION_SECONDS:-86400}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/clauseflow
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: clauseflow
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_REGION: us-east-1
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_PRIVATE_ORIGINS: ${OLLAMA_PRIVATE_ORIGINS:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-clauseflow-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@${DOMAIN}}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      DOCUSEAL_API_URL: ${DOCUSEAL_API_URL:-https://api.docuseal.com}
      DOCUSEAL_API_KEY: ${DOCUSEAL_API_KEY:-}
      DOCUSEAL_PRIVATE_ORIGINS: ${DOCUSEAL_PRIVATE_ORIGINS:-}
      DOCUSEAL_WEBHOOK_SECRET: ${DOCUSEAL_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Caddy (reverse proxy + automatic SSL) ────────────────────────────────
  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - app
    restart: unless-stopped

  # ── PostgreSQL daily backup ──────────────────────────────────────────────
  backup:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      /bin/sh -c "
      backup() {
        tmp=/backups/.clauseflow-$$(date +%Y%m%d-%H%M%S).sql;
        pg_dump -h db -U postgres clauseflow > \"$$tmp\" || { rm -f \"$$tmp\"; return 1; };
        test -s \"$$tmp\" || { rm -f \"$$tmp\"; return 1; };
        gzip -f \"$$tmp\" || { rm -f \"$$tmp\"; return 1; };
        mv \"$$tmp.gz\" /backups/clauseflow-$$(date +%Y%m%d-%H%M%S).sql.gz || return 1;
        find /backups -name '*.sql.gz' -mtime +7 -delete || return 1;
        echo 'Backup completed at '$$(date);
      };
      while true; do backup || exit 1; sleep 86400; done
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  docusealdata:
  caddy_data:
  caddy_config:
  backups:
